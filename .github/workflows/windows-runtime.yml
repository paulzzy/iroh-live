name: Desktop runtime

on:
  workflow_dispatch:
  push:
    branches: ['codex/windows-runtime-tests']
  pull_request:
    paths:
      - '.github/workflows/windows-runtime.yml'
      - '.github/scripts/desktop-build-manifest.py'
      - '.gitattributes'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'iroh-live/**'
      - 'iroh-live-cli/**'
      - 'moq-media/**'
      - 'moq-media-egui/**'

permissions:
  contents: read

concurrency:
  group: windows-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  runtime:
    name: Desktop tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            bin: irl.exe
            asset: irl-windows-x86_64.exe
          - os: windows-2025
            bin: irl.exe
            asset: irl-windows-x86_64.exe
          - os: macos-14
            bin: irl
            asset: irl-macos-aarch64
          - os: macos-26
            bin: irl
            asset: irl-macos-aarch64
    env:
      # Match the upstream Apple silicon release's minimum supported version.
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: '1.99.0'
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows-runtime-${{ matrix.os }}
          cache-on-failure: true

      - name: Install NASM
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install libtool automake

      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint the desktop release feature set
        run: cargo clippy --locked -p iroh-live-cli -p iroh-live -p moq-media -p moq-media-egui --all-targets --features iroh-live-cli/aec,moq-media/test-source -- -D warnings
      - name: CLI and media regression tests
        run: cargo test --locked -p iroh-live-cli -p iroh-live -p moq-media --lib --bins --features iroh-live-cli/aec,moq-media/test-source -- --test-threads=2
      - name: Failed microphone startup must be reported
        run: cargo test --locked -p moq-media --test capture_diagnostics --features capture -- --nocapture
      - name: Audio and video over QUIC, including simultaneous two-way media
        run: cargo test --locked -p iroh-live --test e2e -- --nocapture --test-threads=1
      - name: Measure pipeline delay and recovery after a viewer pause
        run: cargo test --locked -p iroh-live --test latency -- --nocapture --test-threads=1
      - name: Build a desktop diagnostic binary
        run: cargo build --locked --profile release-dist -p iroh-live-cli --features aec
      - name: Enumerate runner devices
        env:
          RUST_LOG: info,moq_media=debug,moq_audio=debug
          IRL_BINARY: target/release-dist/${{ matrix.bin }}
        run: |
          set -euo pipefail
          "$IRL_BINARY" devices 2>&1 | tee runner-devices.txt
      - name: Package binary with build provenance and checksums
        env:
          IRL_BINARY: target/release-dist/${{ matrix.bin }}
          IRL_ASSET: ${{ matrix.asset }}
          IRL_RUNNER: ${{ matrix.os }}
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            python3 .github/scripts/desktop-build-manifest.py "$IRL_BINARY" "$IRL_ASSET" "$IRL_RUNNER"
          else
            python .github/scripts/desktop-build-manifest.py "$IRL_BINARY" "$IRL_ASSET" "$IRL_RUNNER"
          fi
      - name: Verify packaged checksums
        working-directory: desktop-dist
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            shasum -a 256 -c SHA256SUMS
          else
            sha256sum -c SHA256SUMS
          fi
      - name: Upload diagnostic binary, provenance, and device inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: irl-diagnostics-${{ matrix.os }}
          path: |
            desktop-dist/*
            runner-devices.txt
          if-no-files-found: error
